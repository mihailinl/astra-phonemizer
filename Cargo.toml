[package]
name = "astra-phonemizer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "GPL-licensed phonemizer for Astra — espeak-ng wrapper with ndjson IPC"

[[bin]]
name = "astra-phonemizer"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
pkg-config = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true
