name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-aarch64
          - os: macos-15
            target: x86_64-apple-darwin
            suffix: macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install espeak-ng (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libespeak-ng-dev pkg-config

      - name: Install espeak-ng (macOS)
        if: runner.os == 'macOS'
        run: brew install espeak-ng pkg-config

      - name: Install espeak-ng (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $espeakUrl = "https://github.com/espeak-ng/espeak-ng/releases/download/1.51/espeak-ng-X64.msi"
          Invoke-WebRequest -Uri $espeakUrl -OutFile espeak-ng.msi
          Start-Process msiexec.exe -Wait -ArgumentList '/i', 'espeak-ng.msi', '/quiet', '/norestart'

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../astra-phonemizer-${{ matrix.suffix }}.tar.gz astra-phonemizer

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../astra-phonemizer-${{ matrix.suffix }}.tar.gz astra-phonemizer.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-phonemizer-${{ matrix.suffix }}
          path: astra-phonemizer-${{ matrix.suffix }}.tar.gz

  release:
    needs: build
    if: always() && contains(needs.build.result, 'success') || needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;

      - name: Generate SHA256SUMS
        run: |
          cd release
          sha256sum *.tar.gz > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
