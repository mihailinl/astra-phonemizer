name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install espeak-ng (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libespeak-ng-dev pkg-config

      - name: Install espeak-ng (macOS)
        if: runner.os == 'macOS'
        run: brew install espeak-ng pkg-config

      - name: Install espeak-ng (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Download espeak-ng release (MSI installs the DLL + data)
          $msiUrl = "https://github.com/espeak-ng/espeak-ng/releases/download/1.51/espeak-ng-X64.msi"
          Invoke-WebRequest -Uri $msiUrl -OutFile espeak-ng.msi
          Start-Process msiexec.exe -Wait -ArgumentList '/i', 'espeak-ng.msi', '/quiet', '/norestart', "INSTALLDIR=C:\espeak-ng"

          # The MSI installs to C:\Program Files\eSpeak NG — find the DLL
          $espeakDir = "C:\Program Files\eSpeak NG"
          if (!(Test-Path "$espeakDir")) {
            $espeakDir = "C:\espeak-ng"
          }
          Write-Host "espeak-ng installed to: $espeakDir"
          Get-ChildItem $espeakDir -Recurse | ForEach-Object { Write-Host $_.FullName }

          # Create a lib directory and generate import library from DLL
          $libDir = "C:\espeak-ng-lib"
          New-Item -ItemType Directory -Force -Path $libDir

          # Find the DLL
          $dll = Get-ChildItem "$espeakDir" -Recurse -Filter "espeak-ng.dll" | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName "$libDir\espeak-ng.dll"

            # Generate .def file from DLL exports
            $dumpbin = & "dumpbin" /exports $dll.FullName
            $defContent = "LIBRARY espeak-ng`nEXPORTS`n"
            $inExports = $false
            foreach ($line in $dumpbin) {
              if ($line -match "ordinal\s+hint\s+RVA\s+name") {
                $inExports = $true
                continue
              }
              if ($inExports -and $line -match "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)") {
                $defContent += "  $($Matches[1])`n"
              }
            }
            Set-Content "$libDir\espeak-ng.def" $defContent

            # Generate import library
            & "lib" "/def:$libDir\espeak-ng.def" "/out:$libDir\espeak-ng.lib" "/machine:x64"
            Write-Host "Generated espeak-ng.lib"
          } else {
            Write-Host "ERROR: espeak-ng.dll not found!"
            exit 1
          }

          # Set env for build.rs
          echo "ESPEAK_LIB_DIR=$libDir" >> $env:GITHUB_ENV
          echo "ESPEAK_DLL_DIR=$libDir" >> $env:GITHUB_ENV

      - name: Build release (Unix)
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../astra-phonemizer-${{ matrix.suffix }}.tar.gz astra-phonemizer

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Include espeak-ng DLL alongside the binary
          cp "$ESPEAK_DLL_DIR/espeak-ng.dll" target/${{ matrix.target }}/release/ || true
          cd target/${{ matrix.target }}/release
          tar czf ../../../astra-phonemizer-${{ matrix.suffix }}.tar.gz astra-phonemizer.exe espeak-ng.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-phonemizer-${{ matrix.suffix }}
          path: astra-phonemizer-${{ matrix.suffix }}.tar.gz

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          ls -la release/

      - name: Generate SHA256SUMS
        run: |
          cd release
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
