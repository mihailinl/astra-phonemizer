name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install espeak-ng (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libespeak-ng-dev pkg-config

      - name: Install espeak-ng (macOS)
        if: runner.os == 'macOS'
        run: brew install espeak-ng pkg-config

      - name: Install espeak-ng (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          :: Download espeak-ng MSI
          curl -L -o espeak-ng.msi https://github.com/espeak-ng/espeak-ng/releases/download/1.51/espeak-ng-X64.msi
          msiexec /i espeak-ng.msi /quiet /norestart INSTALLDIR=C:\espeak-ng

          :: Create lib dir
          mkdir C:\espeak-ng-lib
          copy C:\espeak-ng\libespeak-ng.dll C:\espeak-ng-lib\

          :: Write .def with the espeak-ng functions we use
          (
            echo LIBRARY libespeak-ng
            echo EXPORTS
            echo   espeak_Initialize
            echo   espeak_SetVoiceByName
            echo   espeak_TextToPhonemes
            echo   espeak_Info
            echo   espeak_Terminate
            echo   espeak_SetParameter
            echo   espeak_Synth
            echo   espeak_Cancel
            echo   espeak_ListVoices
          ) > C:\espeak-ng-lib\espeak-ng.def

          :: Generate import library using lib.exe from VS
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          lib /def:C:\espeak-ng-lib\espeak-ng.def /out:C:\espeak-ng-lib\espeak-ng.lib /machine:x64

          :: Verify
          dir C:\espeak-ng-lib\

      - name: Set espeak env (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "ESPEAK_LIB_DIR=C:/espeak-ng-lib" >> $GITHUB_ENV
          echo "ESPEAK_DLL_DIR=C:/espeak-ng-lib" >> $GITHUB_ENV

      - name: Build release (Unix)
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../astra-phonemizer-${{ matrix.suffix }}.tar.gz astra-phonemizer

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Include espeak-ng DLL and data directory alongside the binary
          cp "$ESPEAK_DLL_DIR/libespeak-ng.dll" target/${{ matrix.target }}/release/ || true
          cp -r "C:/espeak-ng/espeak-ng-data" target/${{ matrix.target }}/release/ || true
          cd target/${{ matrix.target }}/release
          tar czf ../../../astra-phonemizer-${{ matrix.suffix }}.tar.gz astra-phonemizer.exe libespeak-ng.dll espeak-ng-data/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-phonemizer-${{ matrix.suffix }}
          path: astra-phonemizer-${{ matrix.suffix }}.tar.gz

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          ls -la release/

      - name: Generate SHA256SUMS
        run: |
          cd release
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
