name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install espeak-ng (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libespeak-ng-dev pkg-config

      - name: Install espeak-ng (macOS)
        if: runner.os == 'macOS'
        run: brew install espeak-ng pkg-config

      - name: Install espeak-ng (Windows via vcpkg)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install espeak-ng:x64-windows
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - name: Build release (Unix)
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export ESPEAK_LIB_DIR="$VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib"
          export ESPEAK_INCLUDE_DIR="$VCPKG_INSTALLATION_ROOT/installed/x64-windows/include"
          cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../astra-phonemizer-${{ matrix.suffix }}.tar.gz astra-phonemizer

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Include espeak-ng DLL alongside the binary
          cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/espeak-ng.dll" target/${{ matrix.target }}/release/ || true
          cd target/${{ matrix.target }}/release
          tar czf ../../../astra-phonemizer-${{ matrix.suffix }}.tar.gz astra-phonemizer.exe espeak-ng.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-phonemizer-${{ matrix.suffix }}
          path: astra-phonemizer-${{ matrix.suffix }}.tar.gz

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          ls -la release/

      - name: Generate SHA256SUMS
        run: |
          cd release
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
